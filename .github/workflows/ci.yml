name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: tools/check.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kapelo-worker:ci .
      - name: The tools are there and it runs as uid 1000
        run: |
          docker run --rm kapelo-worker:ci version
          docker run --rm --entrypoint sh kapelo-worker:ci -c 'opencode --version && pg_ctl --version && test "$(id -u)" = 1000'
