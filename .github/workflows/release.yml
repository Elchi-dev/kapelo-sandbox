name: release

# A tag v* publishes the binaries with signed checksums and the image
# ghcr.io/elchi-dev/kapelo-worker, signed with Sigstore (keyless, by this
# workflow's identity).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: sigstore/cosign-installer@v3
      - name: Binaries
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/kapelo-worker_${t%/*}_${t#*/}" ./cmd/kapelo-worker
          done
          (cd dist && sha256sum kapelo-worker_* > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/elchi-dev/kapelo-worker:${{ github.ref_name }}
            ghcr.io/elchi-dev/kapelo-worker:latest
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/elchi-dev/kapelo-worker@${{ steps.image.outputs.digest }}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Image: ghcr.io/elchi-dev/kapelo-worker@${{ steps.image.outputs.digest }}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
